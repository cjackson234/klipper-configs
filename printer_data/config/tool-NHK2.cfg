[mcu NHK2]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834045D48-if00
restart_method: command

[extruder2]
step_pin: NHK2:gpio23
dir_pin: NHK2:gpio24
enable_pin: !NHK2:gpio25
heater_pin: NHK2:gpio9
sensor_pin: NHK2:gpio29
pullup_resistor: 2200
rotation_distance: 47.088
gear_ratio: 9:1
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 300
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
control: pid
pid_kp: 35.203
pid_ki: 4.790
pid_kd: 64.685
##	Try to keep pressure_advance below 1.0
pressure_advance: 0.0565 #0.032
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 50
max_extrude_only_distance: 700.00

[tmc2209 extruder2]
sense_resistor: 0.100
uart_pin: NHK2:gpio0
tx_pin: NHK2:gpio1
interpolate: false
run_current: 0.6

[fan_generic NHK2_partfan]
pin: NHK2:gpio6
#tachometer_pin: NHK2:gpio17
#tachometer_ppr: 2


[heater_fan NHK2_hotend_fan]
pin: NHK2:gpio5
tachometer_pin: NHK2:gpio16
tachometer_ppr: 2
heater: extruder2
heater_temp: 50.0

[tool NHK2]
tool_number: 2
extruder: extruder2
fan: fan_generic NHK2_partfan
gcode_x_offset: 1.14
gcode_y_offset: -0.15
gcode_z_offset: -0.185000 #-0.6
params_park_x: 178 #262.1
params_park_y: 4
params_park_z: 420
params_close_y: 60.0
params_safe_y: 125.0
params_input_shaper_freq_x: 62.4
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_y: 88.6
params_input_shaper_type_y: 'mzv'

# Change tool number if needed
[tool_probe NHK2]
pin: ^NHK2:gpio10
tool: 2
z_offset: 0
speed: 15.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
  _TAP_PROBE_ACTIVATE HEATER=extruder2

[adxl345 NHK2]
cs_pin: NHK2:gpio21
spi_software_sclk_pin: NHK2:gpio18
spi_software_mosi_pin: NHK2:gpio20
spi_software_miso_pin: NHK2:gpio19
axes_map: x,z,y

#####################################################################
#   Thermistors
# #####################################################################
## External Chamber Thermistor Port
#[temperature_sensor chamber_temp]
#sensor_type: Generic 3950
#sensor_pin: NHK2:gpio28
#min_temp: 0
#max_temp: 100
#gcode_id: chamber_th

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor nh2_temp]
## Nitehawk PCB Sensor
sensor_type: CMFB103F3950FANT
sensor_pin: NHK2:gpio26
pullup_resistor: 2200
min_temp: 0
max_temp: 100
gcode_id: chamber_th2

#####################################################################
#   Lights
#####################################################################
## Stealthburner Headlights
[neopixel sb_leds2]
pin: NHK2:gpio7

## PCB Activity Light
[output_pin act_led2]
pin: !NHK2:gpio8

#####################################################################
#   Macros
# #####################################################################

[filament_switch_sensor filament_sensor_NHK2]
switch_pin: NHK2:gpio13
pause_on_runout: FALSE
runout_gcode:
  M117 Runout sensor NHK2 reports: Runout
  SET_GCODE_VARIABLE MACRO=NHK2 VARIABLE=filament_consumed VALUE=1
insert_gcode:
  M117 Runout sensor NHK2 reports: Filament Detected
  SET_GCODE_VARIABLE MACRO=NHK2 VARIABLE=filament_consumed VALUE=0

[gcode_macro NHK2]
variable_active: 0
variable_filament_consumed: 0
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=NHK2 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder2
    SELECT_TOOL T=2
  {% endif %}

[gcode_macro T2]
variable_realtool: "NHK2"
variable_backuptool: "T0"
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
