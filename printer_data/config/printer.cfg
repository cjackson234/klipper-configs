
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# ####################################################################
# 	mcu
# ####################################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_060016000E51323532393433-if00

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 12000 #7000
max_z_velocity: 400
max_z_accel: 3000 #2000


# This file contains common pin mappings for the BIGTREETECH Kraken.
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

#####################################################################
# 	X/Y Stepper Settings
#####################################################################
# S1
[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin:  tmc5160_stepper_x:virtual_endstop
position_endstop: 355
position_max: 355
homing_speed: 100
homing_retract_dist: 0
homing_positive_dir: true

# S2
[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 355
position_max: 355
position_min: -20
homing_speed: 100
homing_retract_dist: 0
homing_positive_dir: true

#####################################################################
# 	Z Stepper Settings
#####################################################################

# S5
[stepper_z]
step_pin: PG9
dir_pin: !PG10
enable_pin: !PG13
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 490 
position_min: -100 #-5
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 3


# S6
[stepper_z1]
step_pin: PG11
dir_pin: PD7
enable_pin: !PG12
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200


# S7
[stepper_z2]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200

# S8
[stepper_z3]
step_pin: PG15
dir_pin: PB6
enable_pin: !PG14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200



# ####################################################################
# 	Bed Heater
# ####################################################################

# [heater_bed]
# heater_pin: PF5
# sensor_pin: PB0 # TB
# sensor_type: ATC Semitec 104GT-2
