[include ./nitehawk-sb.cfg]

#####################################################################
# 	Extras
#####################################################################
#[virtual_sdcard]
#path: ~/gcode_files

[display_status]
[skew_correction]

[bed_mesh]
speed: 1000
horizontal_move_z: 3

# relative to probe
mesh_min: 25, 70
mesh_max: 325,335

probe_count: 25,25
#mesh_pps: 2,2
algorithm: bicubic
#move_check_distance: 3
split_delta_z: .01
fade_start: 0.5
fade_end: 15.0
#relative_reference_index: 24

[input_shaper]
#shaper_freq_x: 31.620553  #55.6
