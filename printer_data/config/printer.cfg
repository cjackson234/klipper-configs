#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 43200 # 12hr

#[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
#home_xy_position:170,170
#speed:100
#z_hop:10

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

##	Gantry Corners for 300mm Build
##	Uncomment for 300mm build
gantry_corners:
	-60,-10
	360,370
#	Probe points
points:
	50,25
	50,225
	250,225
	250,25
#--------------------------------------------------------------------
speed: 400
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10 #10

[bed_mesh]
speed: 60
horizontal_move_z: 1 #10

# relative to probe
mesh_min: 30,30
mesh_max: 275,275

probe_count: 5,5
#mesh_pps: 2,2
algorithm: bicubic
#move_check_distance: 3
split_delta_z: .01
fade_start: 1
fade_end: 10
fade_target: 0
#relative_reference_index: 24

[force_move]
enable_force_move: True

[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

#####################################################################
# 	Macros
#####################################################################

[display_status]

[include nest.cfg]

[include tool-NHK0.cfg]
[include tool-NHK1.cfg]


[include toolchanger-tool_detection.cfg]
[include toolchanger.cfg]
[include toolchanger-macros.cfg]
[include toolchanger-homing.cfg]

[include toolchanger-extra-macros.cfg]
[include toolchanger-usermacros.cfg]

#[include calibrate-offsets.cfg]
#tools

[include mainsail.cfg]

