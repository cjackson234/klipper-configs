# ####################################################################
# 	stepers
# ####################################################################

[tmc5160 stepper_x]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PC15
driver_SGT: 1  # -64 is most sensitive value, 63 is least sensitive
run_current: 0.800
interpolate: False
sense_resistor: 0.022
stealthchop_threshold: 000000

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PF0
driver_SGT: 1  # -64 is most sensitive value, 63 is least sensitive
run_current: 0.800
interpolate: False
sense_resistor: 0.022
stealthchop_threshold: 000000

[tmc5160 stepper_z]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.6
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z1]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.6
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z2]
cs_pin: PA9
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.6
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z3]
cs_pin: PA10
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.6
interpolate: False
sense_resistor: 0.075
stealthchop_threshold: 0

# ####################################################################
# 	board aliases
# ####################################################################

[board_pins]
aliases:
    # FPC header, Aliases EXP1 & EXP2 for mini12864
    EXP1_1=PG5, EXP1_2=PG4,
    EXP1_3=PG3, EXP1_4=PG2,
    EXP1_5=PD15, EXP1_6=PD14,
    EXP1_7=PD13, EXP1_8=PD12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PG8, EXP2_4=PE11,
    EXP2_5=PG7, EXP2_6=PE14,
    EXP2_7=PG6, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.


#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 43200 # 12hr

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
#  Probe points
points:
  50,25
  50,275
  300,275
  300,25
#--------------------------------------------------------------------
speed: 200
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0150
max_adjust: 150

[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

[bed_mesh]
speed: 1000
horizontal_move_z: 3

# relative to probe
mesh_min: 25, 70
mesh_max: 325,335

probe_count: 9,9
mesh_pps: 2,3
algorithm: bicubic
#move_check_distance: 3
split_delta_z: .01
fade_start: 0.5
fade_end: 15.0

########################################
# Calibration
########################################

[gcode_macro _CALIBRATION_SWITCH]
variable_x: 229.00
variable_y: 353.00
variable_z: 10.00
gcode:

[tools_calibrate]
pin: PF1
travel_speed: 20
spread: 7
lower_z: 1.0
# The speed (in mm/sec) to move tools down onto the probe
speed: 1.5
# The speed (in mm/sec) to retract between probes
lift_speed: 4
final_lift_z: 3
samples:5
samples_result: median # median, average
sample_retract_dist:1
samples_tolerance:0.02
samples_tolerance_retries:2
# Decrease -> higher nozzle
trigger_to_bottom_z: -1.20

########################################
# Temps
########################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

