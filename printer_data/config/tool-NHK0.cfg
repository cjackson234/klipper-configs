[mcu NHK0]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834044FFF-if00
restart_method: command

[extruder]
step_pin: NHK0:gpio23
dir_pin: NHK0:gpio24
enable_pin: !NHK0:gpio25
heater_pin: NHK0:gpio9
sensor_pin: NHK0:gpio29
pullup_resistor: 2200
rotation_distance: 47.088
gear_ratio: 9:1
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 300
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
control: pid
pid_kp: 36.479
pid_ki: 3.987
pid_kd: 83.447
##	Try to keep pressure_advance below 1.0
pressure_advance: 0.0565 #0.032
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 50
max_extrude_only_distance: 700.00

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: NHK0:gpio0
tx_pin: NHK0:gpio1
interpolate: false
run_current: 0.6

[fan_generic NHK0_partfan]
pin: NHK0:gpio6
#tachometer_pin: NHK0:gpio17
#tachometer_ppr: 2


[heater_fan NHK0_hotend_fan]
pin: NHK0:gpio5
tachometer_pin: NHK0:gpio16
tachometer_ppr: 2
heater: extruder
heater_temp: 50.0

[tool NHK0]
tool_number: 0
extruder: extruder
fan: fan_generic NHK0_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 10.0 #262.1
params_park_y: 6.0
params_park_z: 417.50 #421.0
params_close_y: 60.0
params_safe_y: 125.0
params_input_shaper_freq_x: 62.4
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_y: 88.6
params_input_shaper_type_y: 'mzv'

# Change tool number if needed
[tool_probe NHK0]
pin: ^NHK0:gpio10
tool: 0
z_offset: -1.10 #-1.90 #-1.3000 #-0.480 #-1.170 #the more positive the closer to the bed
speed: 5.0
samples: 5
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.04
samples_tolerance_retries: 3
activate_gcode:
  _TAP_PROBE_ACTIVATE HEATER=extruder

[adxl345 NHK0]
cs_pin: NHK0:gpio21
spi_software_sclk_pin: NHK0:gpio18
spi_software_mosi_pin: NHK0:gpio20
spi_software_miso_pin: NHK0:gpio19
#axes_map: x,z,y

#####################################################################
#   Thermistors
# #####################################################################
## External Chamber Thermistor Port
#[temperature_sensor chamber_temp]
#sensor_type: Generic 3950
#sensor_pin: NHK0:gpio28
#min_temp: 0
#max_temp: 100
#gcode_id: chamber_th

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor nh_temp]
## Nitehawk PCB Sensor
sensor_type: CMFB103F3950FANT
sensor_pin: NHK0:gpio26
pullup_resistor: 2200
min_temp: 0
max_temp: 100
gcode_id: chamber_th

#####################################################################
#   Lights
#####################################################################
## Stealthburner Headlights
[neopixel sb_leds]
pin: NHK0:gpio7

## PCB Activity Light
[output_pin act_led]
pin: !NHK0:gpio8

#####################################################################
#   Macros
# #####################################################################

[filament_switch_sensor filament_sensor_NHK0]
switch_pin: NHK0:gpio13
pause_on_runout: FALSE
runout_gcode:
  M117 Runout sensor NHK0 reports: Runout
  SET_GCODE_VARIABLE MACRO=NHK0 VARIABLE=filament_consumed VALUE=1
insert_gcode:
  M117 Runout sensor NHK0 reports: Filament Detected
  SET_GCODE_VARIABLE MACRO=NHK0 VARIABLE=filament_consumed VALUE=0

[gcode_macro NHK0]
variable_active: 0
variable_filament_consumed: 0
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=NHK0 VARIABLE=active VALUE=1
    ACTIVATE_extruder extruder=extruder
    SELECT_TOOL T=0
  {% endif %}

[gcode_macro T0]
variable_realtool: "NHK0"
variable_backuptool: "T1"
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
