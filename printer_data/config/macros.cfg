[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - PLEASE CUSTOMISE THE SCRIPT
gcode:
    {% set BED = params.BED|int %}
    {% set EXTRUDER = params.EXTRUDER|int %}
    {% set z_adjust = params.Z_ADJUST|default(0.0)|float %}
    {% set initial_tool = params.TOOL|default("0")|int %}
    {% set retract = 10 %}
    M117 Heating...
    M140 S{BED}                         ; set bed final temp
    M104 S{EXTRUDER}                         ; set extruder final temp
    M190 S{BED}                         ; wait for bed final temp
    M109 S{EXTRUDER}                         ; wait for extruder final temp
    DAYLIGHT_ON
    G28
    #CLEAN_HEAD
    G28 Z
    #STATUS_LEVELING
    Z_TILT_ADJUST
    
    AFC_PARK

    ##  Uncomment for bed mesh (1 of 2)
    BED_MESH_CLEAR       # Clears old saved bed mesh (if any)
    ##  Uncomment for bed mesh (2 of 2)
    #SET_DISPLAY_TEXT MSG="Bed mesh"    # Displays info
    #STATUS_MESHING                     # Sets SB-leds to bed mesh-mode
    bed_mesh_calibrate                 # Starts bed mesh

    AFC_PARK

    #CLEAN_HEAD
    G1 Z4
    
    #SET_PLATE_OFFSET
    #G28
    #Attach_Probe_Lock
    #CALIBRATE_Z
    #Dock_Probe_Unlock
    ##  Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##  Uncomment for 250mm build
    #G0 X125 Y125 Z30 F3600

    ##  Uncomment for 300 build
    #G0 X150 Y150 Z30 F3600

    ##  Uncomment for 350mm build
    #G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------
    
    #PURGE_BLOB
    LINE_PURGE
   

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-18 F800                   ;retract filament from meltzone
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    DAYLIGHT_OFF

[gcode_macro TEST_CALIBRATE]
gcode:
    G28
    Attach_Probe
    Calibrate_Z

[gcode_macro CLEAN_HEAD]
gcode:
    M117 Cleaning nozzle...
    SAVE_GCODE_STATE NAME=clean
    G90
    G1 Z4
    G1 X184 Y302 F24000
    G1 X260 Y302 F18000
    G1 Z-0.5 F5000
    G1 X260 Y302 F5000
    G1 X184 Y302 F15000
    G1 X260 Y302 F15000
    G1 X184 Y302 F15000
    G1 X260 Y302 F15000
    G1 X184 Y302 F15000
    RESTORE_GCODE_STATE NAME=clean

[gcode_macro PURGE_LINE]
gcode:
    SAVE_GCODE_STATE NAME=PURGE_LINE
    M117 Prime Line
    # CG28                            ; home all axes if not already
    G90                             ; absolute coords
    M83                             ; extruder relative
    G1 Z2.5 F3000                   ; Move Z axis up
    G1 X2 Y10.0 F5000.0               ; Move to start position
    G1 Z2                        ; Move Z axis down
    G92 E0.0                        ; Reset Extruder

    G1 Y210.0 F1500.0 E20           ; Draw the first line
    G1 X3 F5000.0                   ; Move to side a little
    G1 Y10.0 F1500.0 E20            ; Draw the second line
    G10                             ; retract to avoid stringing

    G92 E0.0                        ; Reset Extruder
    G1 Z5.0 F3000                   ; Move Z Axis up
    RESTORE_GCODE_STATE NAME=PURGE_LINE

[gcode_macro SET_PLATE_OFFSET]
gcode:
    SET_GCODE_OFFSET Z=1.650; 1.68

[gcode_macro DAYLIGHT_ON]
gcode:
    SET_PIN PIN=daylight VALUE=1.00

[gcode_macro DAYLIGHT_OFF]
gcode:
    SET_PIN PIN=daylight VALUE=0.00

# In order to use this you need to increase max_extrude_cross_section in your extruder config or klipper will complain. I set mine to 30
[gcode_macro PURGE_BLOB]
gcode:
    # This is for a 300mm bed. If you have a diferent bed size you may want to adjust the line below
    {% set rand_pos = (105 + ( printer.system_stats.cputime * 1000 ) % 60) %}           ; Generate pseudo random start pos so we dont wear out that one spot on the bed. 
    M117 Purging at X{ rand_pos }                                                       
    
    # The start pos will be within the "handle" of the flex plate where there is some extra Y space available so we can go all the way to Y0
    # If your setup does not have this extra space then just increase the y valie in the line "G1 X{ rand_pos } Y0 Z1 F18000"
    G92 E0                          ; zero the extruder
    G90                             ; absolute positioning
    G1 X{ rand_pos } Y0 Z1 F18000   ; Go to start pos for perge line
    G1 Z0.4 F600                    ; Lower to purge height
    G91                             ; relative positioning
    G1 X5 E40 F40                   ; Extrude blob of filament on the bed
    M106 P0                         ; Enable Cooling Fan
    G1 X20 Z5 F100                  ; Slow drag away from the blob with fans helping cool and break strings. Also raiz z zo the blob clears the fan duct
    G1 X5  Z-5.1 F9000              ; Now that the blob has cleared the duct we go back down for a short 0.3mm height extrusion
    G1 X5 E2 F180                   ; Slow 5mm extrude move to help with stringing
    G1 X30 E-1 F6000                ; Fast move and retract to break strings and reduce ooze
    G1 Z1 F100                      ; Lift
    M106 P0 S0                      ; Disable Cooling Fan
    G92 E0                          ; zero the extruder
    G90                             ; absolute positioning

[gcode_macro PRIMING]
gcode:
    M106 S150                      ;partcooling fan max
    G90
    CLEAN                          ;call clean macro
    G1  Z10 F3000                  ;move up by 10 to avoid objects
    G1  X15 Y5 F15000              ;move to purge position
    G1  Z0.5 F3000                 ;move to purge position
    G91                            ;incremental positioning
    G1  Z0.3 E30 F3                ;prime hotend
    G1  Z2.0 E25 F30               ;purge and move up
    G1  Z4.0 E20 F60               ;purge and move up
    G1  Z2.0 E10 F240              ;purge and move up
    G1  Z10  E-0.1 F3600           ;move up by 10 and retract slightly
    G1  Y55 Z-18.25 F3000          ;move to wiping start
    G1  Y10 F3000                  ;wipe back
    G1  Y-10 F3000                 ;wipe forth
    G1  Y10 F3000                  ;wipe back
    G1  Y-10 F3000                 ;wipe forth
    G1  Y-48 F3000                 ;wipe end and kick off the poop pellet
    M107                           ;turn cooling fan off
    G1  Z2.0  F3000                ;move up
    G1  Y55   F7000                ;move from pellet bin quickly!
    M82                            ;extruder absolute
    G92 E0.0                       ;extruder reset
    G90                            ;absolute positioning
    M107                           ;partcooling fan off

    #------------------------------------------------------------------------

[gcode_macro CLEAN]
gcode:
    M204 S6000                     ;set acceleration to 6000
    G1 X5 Y35 F15000               ;move to position
    G1 Z0.5 F3000                  ;move to position
    G1 Y1 F10000                   ;kick the prime tower off
    
    #------------------------------------------------------------------------