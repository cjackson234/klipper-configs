# Unable to parse '[Undefined]' as a literal: malformed node or string on line 1:  in 'SET_GCODE_VARIABLE MACRO=PARK_FANS VARIABLE=tool_queue VALUE="[Undefined]"'

[delayed_gcode park_fans_loop]
gcode:
  {% set queued_tools   = printer["gcode_macro PARK_FANS"].tool_queue %}
  {% set fan_timers     = printer["gcode_macro PARK_FANS"].remaining_time %}
  {% set n_queued_tools = [] %}
  {% set n_fan_timers   = [] %}

  {% for time in fan_timers %}
    {% set tn = queued_tools[loop.index0]|int %}

    {% if time-1 == 0 %}
      # Only turn the fan off if the tool is not printing
      # Only turn the fan off if the tool is not printing
      {% if tn != printer.toolchanger.tool_number|int %}
        {% set extruder_id = "extruder" + tn|string if tn > 0 else "extruder" %}

        {% if printer[extruder_id].target %}
          M106 T{tn} S0
        {% endif %}
      {% endif %}

    {% else %}
      # Add tool in new list to be passed back to macro
      {% set wishiwashi = n_queued_tools.append(tn) %}
      # Decrement the timer by 1
      {% set zorua = n_fan_timers.append(time-1) %}
    {% endif %}
  {% endfor %}

  SET_GCODE_VARIABLE MACRO=PARK_FANS VARIABLE=tool_queue VALUE="{n_queued_tools|pprint}"
  SET_GCODE_VARIABLE MACRO=PARK_FANS VARIABLE=remaining_time VALUE="{n_fan_timers|pprint}"

  {% if n_queued_tools|length %}
    UPDATE_DELAYED_GCODE ID=park_fans_loop DURATION=1
    RESPOND TYPE=echo MSG="TOOLS: {n_queued_tools|string}, TIMES: {n_fan_timers|string}"
  {% endif %}

[gcode_macro PARK_FANS]
variable_tool_queue: []
variable_remaining_time: []
gcode:
  {% set tn          = params.T|int %}
  {% set percent     = params.PERCENT|int|default(30) %}
  {% set duration    = params.DURATION|int|default(30) %}
  {% set piloswine   = tool_queue.append(tn) %}
  {% set heracross   = remaining_time.append(duration) %}
  {% set extruder_id = "extruder" + tn|string if tn > 0 else "extruder" %}

  {% if printer[extruder_id].target %}
    M106 T{tn} S{((255/100)*(percent|float))|int}
    UPDATE_DELAYED_GCODE ID=park_fans_loop DURATION=1
  {% endif %}

[gcode_macro M107]
description: Override "M107" to allow multiple extruders.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
;Need rename is used with multi_fan
rename_existing: M107.1
gcode:
  M106 S0 {rawparams}


[gcode_macro _TOOLCHANGER_TURN_OFF_FANS]
description: Disable all extruder steppers
gcode:
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    M107 T{tool_nr}
  {% endfor %}

[gcode_macro M104]
rename_existing: M104.1
description: [T<index>] [S<temperature>]
  Set tool temperature.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
  S= Target temperature
gcode:
  {% if params.T is defined %}
    {% set newparameters = "" %}
    {% set newparameters = newparameters ~ " T="~params.T %}
    {% if params.S is defined %}
      {% set newparameters = newparameters ~ " TARGET="~params.S %}
    {% endif %}
    SET_TOOL_TEMPERATURE{newparameters}
  {% else %}
    M104.1 {rawparams}
  {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: [T<index>] [S<temperature>]
  Set tool temperature and wait.
  T= Tool number, optional. If this parameter is not provided, the current tool is used.
  S= Target temperature
gcode:
  {% if params.T is defined %}
    {% set newparameters = "" %}
    {% set newparameters = newparameters ~ " T="~params.T %}
    {% if params.S is defined %}
      {% set newparameters = newparameters ~ " TARGET="~params.S %}
    {% endif %}
    SET_TOOL_TEMPERATURE WAIT=1 {newparameters}
  {% else %}
    M109.1 {rawparams}
  {% endif %}

