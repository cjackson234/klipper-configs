[gcode_macro TOOLCHANGE_DEMO]
description: [SAMPLES=<int>]
  Run random tool changes.
  SAMPLES= Number of changes to run, default is 20.
gcode:
    {% set t = params.SAMPLES|default(20)|int %}
    {% for n in range(t) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}

[gcode_macro PRINT_STATUS]
gcode:
  {% set obj = params.OBJ %}
  RESPOND TYPE=echo MSG="Status for M190 {obj} is { printer[obj] }"

[gcode_macro UNSAFE_LOWER_BED]
description: Lower the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=100
  G0 Z0 F600
  M84

[gcode_macro UNSAFE_RAISE_BED]
description: Raise the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z100 F600
  M84

[gcode_macro G32]
gcode:
  G28
  BED_MESH_CLEAR
  QUAD_GANTRY_LEVEL
  G28 Z
  {% if printer.idle_timeout.state == "Printing" %}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
  {% endif %}
  T0
  M104 S150
  G28 Z
  M104 S150
  NOZZLE_SCRUBBER_W
  CARTOGRAPHER_TOUCH TOLERANCE=0.08 SPEED=3
  # CARTOGRAPHER_THRESHOLD_SCAN SPEED=3 MAX=750 MIN=150 TOLERANCE=0.0750

[gcode_macro PRINT_START]
gcode:
  {% set TOOL_TEMP = params.TOOL_TEMP|default(150)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
  
  M104 S150
  M190 S{ BED_TEMP }
  
  M109 S150
  G0 F30000
  G32
  M109 S0
  {% set LastSetTemp = 0 %}
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
    {% if tooltemp_param in params %}
      M104 T{tool_nr} S{params[tooltemp_param]}
      {% set LastSetTemp = params[tooltemp_param] %}
    {% endif %}
  {% endfor %}
  # M109 T{params.TOOL} S{LastSetTemp}

  PRIME_LINES INITIAL_TOOL={params.TOOL|default(0)|float}
  # SKEW_PROFILE LOAD=CaliFlower

[gcode_macro PRINT_END]
gcode:
  M400                           ; wait for buffer to clear
  CLEAR_PAUSE

  M220 S100
  M221 S100
  SET_PRESSURE_ADVANCE ADVANCE=0
  {% if printer.extruder.temperature >= 180 %}
    M83
    G91
    G1 E-2 F2400                   ; retract filament
    G1 E-2 Z5 F2400
  {% endif %}
  M82
  G90
  UNSELECT_TOOL RESTORE_AXIS=""
  G0 Y325 X175 #Send the shuttle to the back ( mostly done as a hack for print_end) -> print end drop off tool, go in the back and restore z by unselect tool macro
  G0 Z 10
  # SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

  TURN_OFF_HEATERS
  _TOOLCHANGER_TURN_OFF_FANS     ; turn off fan
  M140 S0                        ; turn off bed
  
  M117 Print done

