
[mcu NHK1]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834098A84-if00
restart_method: command

[extruder1]
step_pin: NHK1:gpio23
dir_pin: !NHK1:gpio24
enable_pin: !NHK1:gpio25
heater_pin: NHK1:gpio9
sensor_pin: NHK1:gpio29
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 36.320
pid_Ki: 4.175
pid_Kd: 78.997
pullup_resistor: 2200
rotation_distance: 53.494165  # Re-calibrate your own value
gear_ratio: 44:10, 37:17
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 300
min_extrude_temp: 50
##	Try to keep pressure_advance below 1.0
pressure_advance: 0.022
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 50
max_extrude_only_distance: 700.00

[tmc2209 extruder1]
sense_resistor: 0.100
uart_pin: NHK1:gpio0
tx_pin: NHK1:gpio1
interpolate: false
run_current: 0.6

[fan_generic NHK1_partfan]
pin: NHK1:gpio6

#[fan_generic NHK1_mcufan]
#pin: NHK1:gpio7

[heater_fan NHK1_hotend_fan]
pin: NHK1:gpio5
#tachometer_pin: NHK1:gpio16
#tachometer_ppr: 2
heater: extruder1
heater_temp: 50.0
kick_start_time: 0.5

[tool NHK1]
tool_number: 1
extruder: extruder1
fan: fan_generic NHK1_partfan
detection_pin: !NHK1:gpio10
gcode_x_offset: -2.6
gcode_y_offset: 0.0
gcode_z_offset: -0.05 #-0.23 #-0.45
params_park_x: 59.5
params_park_y: 2.5
params_park_z: 244.0
params_close_y: 30.0
params_safe_y: 120.0
params_input_shaper_freq_x: 102.4
params_input_shaper_type_x: 'zv'
params_input_shaper_freq_y: 20.6
params_input_shaper_type_y: 'zv'
params_input_shaper_damping_ratio_y: 0.058
params_input_shaper_damping_ratio_x: 0.058

# Change tool number if needed
#[tool_probe NHK1]
#pin: ^NHK1:gpio10
#tool: 1
#z_offset: 0
#speed: 5.0
#samples: 3
#samples_result: median
#sample_retract_dist: 2.0
#samples_tolerance: 0.075
#samples_tolerance_retries: 3
#activate_gcode:
#  _TAP_PROBE_ACTIVATE HEATER=extruder1 TEMP=150

[adxl345 NHK1]
cs_pin: NHK1:gpio27
spi_software_sclk_pin: NHK1:gpio18
spi_software_mosi_pin: NHK1:gpio20
spi_software_miso_pin: NHK1:gpio19
axes_map: x,z,y

#[filament_switch_sensor filament_sensor_NHK1]
#switch_pin: nest:PA2
#pause_on_runout: FALSE
#runout_gcode:
#  M117 Runout sensor NHK1 reports: Runout
#  SET_GCODE_VARIABLE MACRO=NHK1 VARIABLE=filament_consumed VALUE=1
#insert_gcode:
#  M117 Runout sensor NHK1 reports: Filament Detected
#  SET_GCODE_VARIABLE MACRO=NHK1 VARIABLE=filament_consumed VALUE=0

[temperature_sensor T1]
sensor_type: temperature_mcu
sensor_mcu: NHK1

[gcode_macro NHK1]
variable_active: 0
variable_filament_consumed: 0
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    _TOOLCHANGER_DISABLE_FILAMENT_SENSORS
    SET_GCODE_VARIABLE MACRO=NHK1 VARIABLE=active VALUE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SELECT_TOOL T=1
  {% endif %}

[gcode_macro T1]
variable_realtool: "NHK1"
variable_backuptool: ""
variable_color: ""
gcode:
  {% set consumed = printer["gcode_macro " ~ realtool].filament_consumed|int %}
  {% if consumed and backuptool %}
    { action_respond_info(realtool ~ " empty loading backup") }
    {backuptool}
  {% else %}
    { action_respond_info("Switching to " ~ realtool) }
    {realtool}
  {% endif %}
